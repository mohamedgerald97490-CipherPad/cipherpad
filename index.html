<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CipherPad | Sécurité Pro</title>
    <style>
        :root {
            --primary: #2f81f7; --success: #3fb950; --warn: #d29922; --danger: #f85149;
            --bg: #0d1117; --card: #161b22; --border: #30363d;
        }

        body {
            background: var(--bg); color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }

        h1 { color: var(--primary); margin-top: 20px; margin-bottom: 30px; font-size: 2.2rem; letter-spacing: -1px; }

        .container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1000px; }

        .panel {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        h2 { color: var(--primary); text-align: center; font-size: 0.9rem; text-transform: uppercase; margin-top: 0; letter-spacing: 1px; margin-bottom: 20px; }

        .display-box {
            background: #000; color: #79c0ff; padding: 18px; border-radius: 12px;
            border: 1px solid var(--border); font-family: 'Consolas', monospace; font-size: 1.3rem;
            margin-bottom: 20px; min-height: 1.5rem; word-break: break-all; text-align: center;
            display: flex; align-items: center; justify-content: center;
        }

        .setting { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.9rem; }
        input[type="range"] { flex: 1; margin: 0 15px; cursor: pointer; }

        input[type="password"], input[type="text"].analyse-field {
            width: 100%; box-sizing: border-box; padding: 14px; background: #0d1117;
            border: 2px solid var(--border); color: white; border-radius: 10px; text-align: center;
            margin-bottom: 12px; font-size: 1.1rem; outline: none; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); }

        #securityPercent { font-size: 4rem; font-weight: 900; display: block; text-align: center; margin: 15px 0; transition: 0.3s; }
        .time-hack { font-size: 0.95rem; text-align: center; font-weight: bold; background: #000; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #222; }

        .history { margin-top: 25px; border-top: 1px solid var(--border); padding-top: 15px; }
        .history-item { font-size: 0.85rem; font-family: monospace; color: #8b949e; margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 5px; }

        button {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; font-size: 0.95rem;
        }
        .btn-gen { background: var(--success); color: white; }
        .btn-gen:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-copy { background: #21262d; color: #c9d1d9; border: 1px solid var(--border); }
        .btn-copy:hover { background: #30363d; }
        .copied { background: var(--primary) !important; color: white !important; }
        .btn-toggle { background: #2f363d; color: #c9d1d9; border: 1px solid var(--border); }

        footer { margin-top: 50px; color: #484f58; font-size: 0.8rem; text-align: center; padding-bottom: 30px; line-height: 1.5; }
    </style>
</head>
<body>

    <h1>🔐 CipherPad</h1>

    <div class="container">
        <div class="panel">
            <h2>🛡️ Générateur Pro</h2>
            <div id="genOutput" class="display-box">••••••••</div>

            <div class="setting">
                <span>Taille: <b id="lenText">16</b></span>
                <input type="range" id="lenInput" min="6" max="50" value="16" oninput="document.getElementById('lenText').innerText = this.value">
            </div>

            <div class="setting"><span>Majuscules</span><input type="checkbox" id="checkUpper" checked></div>
            <div class="setting"><span>Chiffres</span><input type="checkbox" id="checkNum" checked></div>
            <div class="setting"><span>Symboles</span><input type="checkbox" id="checkSym" checked></div>

            <button class="btn-gen" onclick="genererCode()">GÉNÉRER LE CODE</button>
            <button id="copyBtn" class="btn-copy" onclick="copierCode()">📋 COPIER LE CODE</button>

            <div class="history" id="historyLog">
                <span style="font-size: 0.7rem; font-weight: bold; color: var(--primary);">RÉCENTS :</span>
            </div>
        </div>

        <div class="panel">
            <h2>🔍 Analyse de Risque</h2>
            <input type="password" id="analyseInput" class="analyse-field" placeholder="Entrez un mot de passe" oninput="analyserForce()">
            <button id="toggleBtn" class="btn-toggle" onclick="toggleView()">👁️ VOIR LE MOT DE PASSE</button>
            <div id="securityPercent">0%</div>
            <div class="time-hack" id="hackTime">Temps de hack : -</div>
        </div>
    </div>

    <footer>
        <strong>CipherPad © 2026</strong><br>
        Généré localement via Web Crypto API (AES-Ready)<br>
        Aucune donnée ne quitte votre navigateur.
    </footer>

    <script>
        let historique = [];

        function genererCode() {
            const length = parseInt(document.getElementById('lenInput').value);
            let charset = "abcdefghijklmnopqrstuvwxyz";
            if (document.getElementById('checkUpper').checked) charset += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            if (document.getElementById('checkNum').checked) charset += "0123456789";
            if (document.getElementById('checkSym').checked) charset += "!@#$%^&*()-_=+";

            let res = "";
            const randomArray = new Uint32Array(length);
            window.crypto.getRandomValues(randomArray);
            for (let i = 0; i < length; i++) {
                res += charset.charAt(randomArray[i] % charset.length);
            }
            
            document.getElementById('genOutput').innerText = res;
            
            historique.unshift(res);
            if(historique.length > 3) historique.pop();
            updateHistory();

            const btn = document.getElementById('copyBtn');
            btn.innerText = "📋 COPIER LE CODE";
            btn.classList.remove('copied');
        }

        function updateHistory() {
            const log = document.getElementById('historyLog');
            log.innerHTML = '<span style="font-size: 0.7rem; font-weight: bold; color: var(--primary);">RÉCENTS :</span>';
            historique.forEach(pass => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerText = pass;
                log.appendChild(item);
            });
        }

        async function copierCode() {
            const text = document.getElementById('genOutput').innerText;
            if (text.includes("•")) return;
            try {
                await navigator.clipboard.writeText(text);
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✔️ COPIÉ !";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = "📋 COPIER LE CODE";
                    btn.classList.remove('copied');
                }, 2000);
            } catch (err) { console.error("Erreur copie"); }
        }

        function toggleView() {
            const input = document.getElementById('analyseInput');
            const btn = document.getElementById('toggleBtn');
            if (input.type === "password") {
                input.type = "text";
                btn.innerText = "🙈 CACHER LE MOT DE PASSE";
            } else {
                input.type = "password";
                btn.innerText = "👁️ VOIR LE MOT DE PASSE";
            }
        }

        function analyserForce() {
            const val = document.getElementById('analyseInput').value;
            const scoreEl = document.getElementById('securityPercent');
            const timeEl = document.getElementById('hackTime');
            
            if (val.length === 0) { 
                scoreEl.innerText = "0%"; 
                scoreEl.style.color = "inherit";
                timeEl.innerText = "Temps de hack : -";
                return; 
            }
            
            let score = 0;
            if (val.length >= 8) score += 20;
            if (val.length >= 14) score += 20;
            if (/[A-Z]/.test(val)) score += 20;
            if (/[0-9]/.test(val)) score += 20;
            if (/[!@#$%^&*()]/.test(val)) score += 20;

            scoreEl.innerText = score + "%";
            
            let finalColor = "#f85149";
            let time = "Immédiat";

            if(score >= 40) { finalColor = "#d29922"; time = "15 jours"; }
            if(score >= 80) { finalColor = "#3fb950"; time = "400 ans"; }
            if(score >= 100) { finalColor = "#00ff73"; time = "3 millions d'années"; }

            scoreEl.style.color = finalColor;
            timeEl.innerText = "Temps de hack : " + time;
            timeEl.style.color = finalColor;
        }
    </script>
</body>
</html>
